[project]
name = "shortener"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi",
  "uvicorn",
  "psycopg[pool]",
  "redis",
]

[project.scripts]
shortener = "shortener:main"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["shortener"]
